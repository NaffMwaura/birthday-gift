<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>For Yvonne ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,900&display=swap" rel="stylesheet">
<style>
    .emo{-webkit-text-fill-color:initial;font-style:normal}
:root{
  --accent:#ff2d55; --accent-glow:rgba(255,45,85,.5); --rose:#ff8fa3; --royal-red:#6e0000;
  --bg-dark:#0a0a0b; --glass:rgba(255,255,255,.05); --glass-border:rgba(255,255,255,.1); --gold:#e9c46a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;background:var(--bg-dark);color:#fff;font-family:'Montserrat',sans-serif;overflow:hidden}
canvas#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
body::before{content:"";position:fixed;inset:0;z-index:0;background:
  radial-gradient(ellipse at 50% 120%,rgba(255,45,85,.22),transparent 60%),
  radial-gradient(ellipse at 50% -10%,rgba(110,0,0,.35),transparent 55%),
  radial-gradient(circle at center,#1a0a0c 0%,#050505 100%)}

  
/* ---- the original page transition ---- */
.scene{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;display:flex;flex-direction:column;align-items:center;
  padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));text-align:center;
  visibility:hidden;opacity:0;transform:scale(1.1) translateZ(0);transition:all 1.2s cubic-bezier(.4,0,.2,1);overflow-x:hidden;overflow-y:auto}
.scene.active{visibility:visible;opacity:1;transform:scale(1) translateZ(0);z-index:10}
.scene>:first-child{margin-top:auto}.scene>:last-child{margin-bottom:auto}

.big{font-family:'Playfair Display',serif;font-weight:900;font-style:italic;font-size:clamp(2.2rem,9vw,5.2rem);line-height:1.12;
  background:linear-gradient(to right,#fff,var(--accent),#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:shine 4s linear infinite;filter:drop-shadow(0 0 22px rgba(255,45,85,.35));padding:0 4px}
@keyframes shine{to{background-position:200% center}}
.sub{font-size:clamp(.8rem,2.8vw,1.05rem);letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.6);margin:14px 0 36px;line-height:1.7}

.go{font:600 .95rem 'Montserrat',sans-serif;color:#fff;background:transparent;border:1px solid var(--accent);border-radius:50px;
  padding:16px 40px;min-height:50px;cursor:pointer;text-transform:uppercase;letter-spacing:2px;transition:.5s;animation:neonPulse 2s infinite}
.go:hover{background:var(--accent);box-shadow:0 0 50px var(--accent)}
.go:focus-visible,#mute:focus-visible,.star:focus-visible,.env:focus-visible{outline:2px solid var(--rose);outline-offset:4px}
@keyframes neonPulse{0%,100%{box-shadow:0 0 5px var(--accent),0 0 10px var(--accent)}50%{box-shadow:0 0 20px var(--accent),0 0 40px var(--accent)}}
@keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}

#mute{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:40;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--accent);background:rgba(10,10,11,.6);color:var(--accent);font-size:1.1rem;cursor:pointer;display:none;backdrop-filter:blur(6px)}

/* loader */
.bar{width:min(320px,70vw);height:3px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;margin-top:26px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--royal-red),var(--accent),var(--rose));box-shadow:0 0 14px var(--accent)}

/* messages */
#line{font-family:'Playfair Display',serif;font-weight:700;font-style:italic;font-size:clamp(1.7rem,6vw,3rem);min-height:3.4em;max-width:760px;
  display:flex;align-items:center;justify-content:center;line-height:1.3}
.caret::after{content:"|";margin-left:3px;color:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* wish star */
.star{flex:none;width:112px;height:112px;border:0;border-radius:50%;cursor:pointer;margin:6px 0 30px;color:#fff;font-size:2.8rem;
  background:radial-gradient(circle at 35% 30%,#fff,var(--accent) 50%,#800020);box-shadow:0 0 40px var(--accent),0 0 120px var(--accent-glow);animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.12);box-shadow:0 0 60px var(--accent),0 0 160px var(--accent-glow)}}
.star.used{animation:none;transform:scale(.55);opacity:.25;transition:all 1.5s}

/* lanterns */
.lantern{position:fixed;bottom:-120px;z-index:30;width:32px;height:44px;border-radius:12px 12px 8px 8px;pointer-events:none;
  background:linear-gradient(#ffb3c1,var(--accent));box-shadow:0 0 28px 8px rgba(255,45,85,.5);animation:rise linear forwards}
.lantern::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:6px;background:#ff8fa3;border-radius:0 0 8px 8px;transform:translateX(-50%);filter:blur(1px)}
@keyframes rise{0%{transform:translate(0,0) rotate(-3deg);opacity:0}10%{opacity:1}50%{transform:translate(16px,-55vh) rotate(3deg)}100%{transform:translate(-14px,-125vh) rotate(-2deg);opacity:0}}

/* envelope (peeks the letter, then the letter card takes over) */
.env{flex:none;position:relative;width:min(320px,80vw);height:210px;margin:64px auto 24px;cursor:pointer;transition:all .7s}
.env.gone{opacity:0;transform:scale(.9)}
.env div{position:absolute;left:0;right:0;border-radius:6px}
.env .back{inset:0;background:#4d0a18}
.env .peek{left:7%;right:7%;bottom:8px;height:88%;background:#fbf4ea;z-index:3;transition:transform 1s cubic-bezier(.2,.8,.2,1) .5s}
.env.open .peek{transform:translateY(-70px)}
.env .front{inset:0;background:#8f1230;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);z-index:4}
.env .flap{top:0;height:55%;background:#b01a3f;transform-origin:top;clip-path:polygon(0 0,100% 0,50% 100%);z-index:5;transition:transform .9s ease,z-index 0s .45s}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env .seal{left:50%;right:auto;top:44%;width:42px;height:42px;border-radius:50%!important;background:var(--gold);z-index:6;transform:translate(-50%,-50%);
  display:grid;place-items:center;color:#8f1230;box-shadow:0 2px 10px rgba(0,0,0,.5);transition:opacity .4s}
.env.open .seal{opacity:0}
.card{display:none;background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:30px;padding:clamp(26px,6vw,46px);max-width:560px;width:100%;text-align:left;margin:20px 0 28px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.card.show{display:block;animation:fadeIn 1s forwards}
.card h3{font-family:'Dancing Script',cursive;font-size:clamp(2.2rem,8vw,3.2rem);color:var(--accent);margin-bottom:14px;text-shadow:0 0 20px var(--accent-glow)}
.card p{font-size:clamp(.95rem,3.6vw,1.1rem);line-height:1.85;font-weight:300;color:rgba(255,255,255,.85);margin-bottom:.8em}
#toGallery{display:none;margin-bottom:auto}
#toGallery.show{display:inline-block;animation:fadeIn 1s forwards}

/* gallery */
#gallery{padding-top:calc(60px + env(safe-area-inset-top))}
#gallery>:first-child{margin-top:0}#gallery>:last-child{margin-bottom:0}
.wall{display:flex;flex-wrap:wrap;justify-content:center;gap:36px 28px;max-width:1100px;margin:40px auto 44px}
.pol{background:#fbf4ea;padding:12px 12px 16px;width:min(280px,84vw);box-shadow:0 14px 40px rgba(0,0,0,.6);transform:rotate(var(--r));
  transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s;cursor:pointer;color:#3a1a22;position:relative;opacity:0;animation:pin .8s forwards}
.pol::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:22px;background:rgba(255,45,85,.5);transform:translateX(-50%) rotate(-3deg)}
@media(hover:hover){.pol:hover{transform:rotate(0) scale(1.07);z-index:5;box-shadow:0 24px 70px var(--accent-glow)}}
.pol.pop{transform:rotate(0) scale(1.1);z-index:5;box-shadow:0 24px 70px var(--accent-glow)}
.pol img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#222}
.pol p{font-family:'Dancing Script',cursive;font-size:1.6rem;margin-top:10px;line-height:1.1;color:#8f1230}
@keyframes pin{from{opacity:0;translate:0 -40px}to{opacity:1;translate:0 0}}

/* finale */
.fin{font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:clamp(1.5rem,6vw,2.6rem);opacity:0;transition:opacity 2s;margin:8px 0;line-height:1.3}
.fin.show{opacity:1}
.sign{font-family:'Dancing Script',cursive;font-size:clamp(2.8rem,12vw,5.5rem);color:var(--accent);margin-top:24px;clip-path:inset(0 100% 0 0);
  padding:0 6px 10px;text-shadow:0 0 30px var(--accent-glow)}
.sign.write{animation:write 3.2s ease-out forwards}
@keyframes write{to{clip-path:inset(0 0 0 0)}}

@media(max-width:600px){
  .sub{letter-spacing:2px;margin-bottom:28px}
  .go{padding:15px 30px;font-size:.85rem}
  .wall{gap:28px 14px;margin-top:34px}
  .pol{width:calc(50% - 7px);padding:8px 8px 10px}
  .pol p{font-size:1.2rem;margin-top:6px}
  .star{width:96px;height:96px;font-size:2.4rem}
}
@media(max-height:560px){.env{margin-top:50px}.sub{margin-bottom:18px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<button id="mute" aria-label="Mute or unmute music">♪</button>

<section class="scene active" id="s-begin">
  <h1 class="big">It's your b'day, Macy,<br>I celebrate you ❤</h1>
  <p class="sub">Best with music. Turn your sound on.</p>
  <button class="go" id="beginBtn">Begin</button>
</section>

<section class="scene" id="s-load">
  <h2 class="big" id="loadText" style="font-size:clamp(1.6rem,6vw,3rem)">Gathering stardust…</h2>
  <div class="bar"><i id="barFill"></i></div>
</section>

<section class="scene" id="s-msg">
  <h2 id="line" class="caret"></h2>
  <button class="go" id="nextBtn" style="margin-top:30px;opacity:0">Continue</button>
</section>

<section class="scene" id="s-wish">
  <h2 class="big" style="font-size:clamp(1.8rem,7vw,3.4rem);margin-bottom:22px" id="wishTitle"> Tap the star.</h2>
  <button class="star" id="star" aria-label="Make a wish">✦</button>
  <button class="go" id="toLetter" style="opacity:0;pointer-events:none">Open your letter</button>
</section>

<section class="scene" id="s-letter">
  <p class="sub" id="envHint" style="margin:0">Tap the envelope</p>
  <div class="env" id="env" role="button" tabindex="0" aria-label="Open the letter">
    <div class="back"></div><div class="peek"></div><div class="front"></div><div class="flap"></div><div class="seal">♥</div>
  </div>
  <div class="card" id="letterCard"></div>
  <button class="go" id="toGallery">I kept some of your pics <span class="emo">🥰</span></button>
</section>

<section class="scene" id="gallery">
  <h2 class="big">Moments in Time</h2>
  <div class="wall" id="wall"></div>
  <button class="go" id="toFinale">One last thing…</button>
</section>

<section class="scene" id="s-final">
  <p class="fin" id="f1">Out of everyone,</p>
  <p class="fin" id="f2">the universe made one Yvonne.</p>
  <p class="fin" id="f3">Thank you for being you.</p>
  <div class="sign" id="sign"></div>
  <button class="go" id="replay" style="margin-top:36px;opacity:0;transition:opacity 1.5s">Replay the magic</button>
</section>

<audio id="song" loop preload="auto"><source src="Happy%20Birthday%20Prayers.mp3" type="audio/mpeg"></audio>

<script>
/* ================= EDIT YOUR CONTENT HERE ================= */
const NAME = "Mercy";
const INTRO_LINES = [
  "20 years ago, a day like today - God gave the world a precious gift in you.",
  "So this is from Naff to you celebrating who you are.",
  "Ready?"
];
const LETTER_TITLE = "Me to you, " + NAME + ",";
const LETTER = [
  "Happy Happy birthday. Truly.",
  "You are born for an impact. Personally I am proud of you. From the very first day I met you, I knew you were special. May your year be full of 'Faithful God' testimonies and your light so shine before men that the good works in you glorify Him ",
  "Keep winning, keep shining. You have a special place in my heart and I love you so much"
];
const SIGNATURE = "Happy Birthday ❤";
const PHOTOS = [
  { src: "Yvonne.jpg",   cap: "Pure sunshine" },
  { src: "Yvonne1.jpg",  cap: "That smile, though" },
  { src: "Yvonne2.jpeg", cap: "Main character energy" },
  { src: "Yvonne3.jpeg", cap: "Never a dull moment" },
  { src: "Yvonne4.jpeg", cap: "Golden hour person" },
  { src: "Yvonne6.jpeg", cap: "Here's to this year" }
];
/* ========================================================== */

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function go(id){
  document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
  const s = $(id); s.classList.add('active'); s.scrollTop = 0;
}

/* ---------- Canvas: stars, fireflies, sparks ---------- */
const cv = $('fx'), c = cv.getContext('2d'); let W, H;
function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', resize); resize();
const mobile = innerWidth < 700;
const stars = Array.from({length: mobile ? 80 : 150}, () => ({x:Math.random(), y:Math.random(), r:Math.random()*1.3+.3, p:Math.random()*6}));
const flies = Array.from({length: mobile ? 12 : 24}, () => ({x:Math.random()*W, y:Math.random()*H, a:Math.random()*6.28, s:.15+Math.random()*.35, p:Math.random()*6}));
let sparks = [];
function burst(x, y, n = 70, big = true){
  if (mobile) n = Math.ceil(n * .7);
  for (let i = 0; i < n; i++){
    const a = Math.random()*6.283, v = (big ? 1.5 : .3) + Math.random()*(big ? 5 : 1.2);
    sparks.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, l:1, d:.008+Math.random()*.014, h:[345,350,335,15][Math.floor(Math.random()*4)], g:big ? .045 : .01});
  }
}
(function loop(t = 0){
  c.clearRect(0, 0, W, H);
  c.globalCompositeOperation = 'lighter';
  for (const s of stars){
    const a = .3 + .6*Math.abs(Math.sin(t/1400 + s.p));
    c.fillStyle = `rgba(255,225,230,${a})`;
    c.beginPath(); c.arc(s.x*W, s.y*H, s.r, 0, 6.283); c.fill();
  }
  for (const f of flies){
    f.a += (Math.random()-.5)*.1; f.x += Math.cos(f.a)*f.s; f.y += Math.sin(f.a)*f.s - .05;
    if (f.x < -20) f.x = W+20; if (f.x > W+20) f.x = -20; if (f.y < -20) f.y = H+20; if (f.y > H+20) f.y = -20;
    const g = c.createRadialGradient(f.x, f.y, 0, f.x, f.y, 14), a = .25 + .5*Math.abs(Math.sin(t/900 + f.p));
    g.addColorStop(0, `rgba(255,110,140,${a})`); g.addColorStop(1, 'rgba(255,110,140,0)');
    c.fillStyle = g; c.beginPath(); c.arc(f.x, f.y, 14, 0, 6.283); c.fill();
  }
  sparks = sparks.filter(p => p.l > 0);
  for (const p of sparks){
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .985; p.l -= p.d;
    c.fillStyle = `hsla(${p.h},100%,68%,${Math.max(p.l,0)})`;
    c.beginPath(); c.arc(p.x, p.y, 2, 0, 6.283); c.fill();
  }
  c.globalCompositeOperation = 'source-over';
  requestAnimationFrame(loop);
})();
addEventListener('pointermove', e => burst(e.clientX, e.clientY, 2, false));
addEventListener('pointerdown', e => burst(e.clientX, e.clientY, 14, false));

function lanterns(n = 14){
  for (let i = 0; i < n; i++) setTimeout(() => {
    const l = document.createElement('div'); l.className = 'lantern';
    l.style.left = (Math.random()*90 + 3) + 'vw';
    l.style.animationDuration = (11 + Math.random()*6) + 's';
    l.style.scale = (.7 + Math.random()*.6);
    document.body.appendChild(l); setTimeout(() => l.remove(), 18000);
  }, i*350);
}

/* ---------- Music ---------- */
const song = $('song'), mute = $('mute');
function playSong(){
  song.volume = 0; song.play().catch(() => {});
  let v = 0; const f = setInterval(() => { v = Math.min(v + .05, .85); song.volume = v; if (v >= .85) clearInterval(f); }, 150);
  mute.style.display = 'block';
}
mute.onclick = () => { song.muted = !song.muted; mute.textContent = song.muted ? '✕' : '♪'; };

/* ---------- Flow ---------- */
$('beginBtn').onclick = async () => {
  playSong(); go('s-load');
  const steps = ["Gathering stardust…", "Collecting your best moments…", "Wrapping the magic…", "Ready."];
  for (let i = 0; i < steps.length; i++){
    $('loadText').textContent = steps[i];
    $('barFill').style.transition = 'width 1.1s ease';
    $('barFill').style.width = ((i+1)/steps.length*100) + '%';
    await sleep(1400);
  }
  go('s-msg'); runLines();
};

async function typeLine(text){
  const el = $('line'); el.textContent = '';
  for (const ch of text){ el.textContent += ch; await sleep(55); }
}
let li = 0;
async function runLines(){
  const b = $('nextBtn'); b.style.transition = 'none'; b.style.opacity = 0; b.style.pointerEvents = 'none';
  await typeLine(INTRO_LINES[li]);
  b.textContent = li === INTRO_LINES.length-1 ? "Let's go" : "Continue";
  b.style.transition = 'opacity 1s'; b.style.opacity = 1; b.style.pointerEvents = 'auto';
}
$('nextBtn').onclick = () => { if (li < INTRO_LINES.length-1){ li++; runLines(); } else go('s-wish'); };

$('star').onclick = async function(){
  this.classList.add('used'); this.disabled = true;
    $('wishTitle').innerHTML = `I still remember you had to make me save you as Daisy before I knew your real name <span class="emo">😂</span>,anyways <span class="emo">😂😂</span>..`;
  for (let i = 0; i < 7; i++) setTimeout(() => burst(innerWidth*(.15 + Math.random()*.7), innerHeight*(.15 + Math.random()*.5), 90), i*380);
  lanterns(mobile ? 10 : 16);
  await sleep(3200);
  const b = $('toLetter'); b.style.transition = 'opacity 1.2s'; b.style.opacity = 1; b.style.pointerEvents = 'auto';
};
$('toLetter').onclick = () => go('s-letter');

/* letter */
$('letterCard').innerHTML = `<h3>${LETTER_TITLE}</h3>` + LETTER.map(p => `<p>${p}</p>`).join('');
async function openEnv(){
  const e = $('env'); if (e.classList.contains('open')) return;
  e.classList.add('open'); $('envHint').style.opacity = 0;
  burst(innerWidth/2, innerHeight/2, 60);
  await sleep(1900); e.classList.add('gone');
  await sleep(700); e.style.display = 'none'; $('envHint').style.display = 'none';
  $('letterCard').classList.add('show'); burst(innerWidth/2, innerHeight/3, 50);
  await sleep(1200); $('toGallery').classList.add('show');
}
$('env').onclick = openEnv;
$('env').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEnv(); } };
$('toGallery').onclick = () => { go('gallery'); buildWall(); };

/* gallery */
let built = false;
function buildWall(){
  if (built) return; built = true;
  $('wall').innerHTML = PHOTOS.map((p, i) => {
    const r = ((i % 2 ? 1 : -1) * (1 + Math.random()*3)).toFixed(1) + 'deg';
    return `<figure class="pol" style="--r:${r};animation-delay:${.6 + i*0.35}s"><img src="${p.src}" alt="${p.cap}"><p>${p.cap}</p></figure>`;
  }).join('');
  document.querySelectorAll('.pol').forEach(el => el.onclick = () => {
    const was = el.classList.contains('pop');
    document.querySelectorAll('.pol').forEach(x => x.classList.remove('pop'));
    if (!was){ el.classList.add('pop'); const r = el.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2, 30); }
  });
}
$('toFinale').onclick = async () => {
  go('s-final'); lanterns(10);
  $('sign').textContent = SIGNATURE;
  await sleep(1400); $('f1').classList.add('show');
  await sleep(2600); $('f2').classList.add('show');
  await sleep(2800); $('f3').classList.add('show');
  await sleep(2200); $('sign').classList.add('write');
  for (let i = 0; i < 6; i++) setTimeout(() => burst(innerWidth*Math.random(), innerHeight*.5*Math.random() + 40, 80), i*500);
  await sleep(3500); $('replay').style.opacity = 1;
};
$('replay').onclick = () => location.reload();
</script>
</body>
</html>
